<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login - FlashBuy</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    body { font-family: sans-serif; background: #0B1320; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .login-card { background: white; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #FF7A00; margin-bottom: 30px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
    button { width: 100%; padding: 15px; background: #FF7A00; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #ccc; }
    .error { color: #dc3545; background: #f8d7da; padding: 10px; border-radius: 5px; margin-bottom: 20px; display: none; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <h1>🔐 Admin Login</h1>
    <div id="error-msg" class="error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" required placeholder="DATA001">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <div style="margin-bottom: 20px; display: flex; justify-content: center;">
        <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
      </div>
      <button type="submit" id="btnSubmit">Entrar al Panel</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bcryptjs@2.4.3/dist/bcrypt.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://wjvhvcwnkawjtreavirm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indqdmh2Y3dua2F3anRyZWF2aXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNzA0MTQsImV4cCI6MjA4NDg0NjQxNH0.gKj9eBsXKoJG5PePRZyt-Vm8oQfbYXKOb77biE32nxg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');
      const errorDiv = document.getElementById('error-msg');

      const captcha = grecaptcha.getResponse();
      if (!captcha) { alert('Completa el captcha'); return; }

      btn.disabled = true;
      btn.innerText = 'Verificando...';
      errorDiv.style.display = 'none';

      try {
        const { data, error } = await supabase.from('administradores').select('*').eq('id', user).single();
        
        if (error || !data) throw new Error('Usuario no encontrado');

        const match = await bcrypt.compare(pass, data.password_hash);
        if (!match) throw new Error('Contraseña incorrecta');

        if (!data.sesion_activa) throw new Error('Sesión desactivada');

        // Guardar sesión
        const session = {
          id: data.id,
          name: data.name,
          role: data.role,
          email: data.email,
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('flashbuy_admin_session', JSON.stringify(session));

        // REDIRECCIÓN CRÍTICA
        window.location.href = 'flash.html';

      } catch (err) {
        errorDiv.innerText = '❌ ' + err.message;
        errorDiv.style.display = 'block';
        grecaptcha.reset();
      } finally {
        btn.disabled = false;
        btn.innerText = 'Entrar al Panel';
      }
    });
  </script>
  <script src="js/admin-fix.js"></script>
</body>
</html>
