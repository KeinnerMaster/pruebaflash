<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login - FlashBuy</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #0B1320 0%, #1a2332 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-container { background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); width: 100%; max-width: 450px; overflow: hidden; }
    .login-header { background: linear-gradient(135deg, #FF7A00 0%, #ff8c1a 100%); padding: 40px 30px; text-align: center; color: white; }
    .logo { width: 120px; filter: brightness(0) invert(1); margin-bottom: 20px; }
    .login-body { padding: 40px 30px; }
    .form-group { margin-bottom: 25px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; }
    .btn-login { width: 100%; padding: 16px; background: #FF7A00; color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
    .error-message { background: #ffebee; color: #c62828; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <img src="flashbuy-logo-white.svg" alt="FlashBuy" class="logo">
      <h1>🔐 Admin Panel</h1>
    </div>
    <div class="login-body">
      <div class="error-message" id="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="username" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-message');
      const btnLogin = document.getElementById('btnLogin');

      btnLogin.disabled = true;
      btnLogin.textContent = 'Verificando...';

      try {
        // 1. Verificar si hay una sesión global bloqueada
        const { data: globalSession, error: sessionError } = await window.supabase
            .from('site_settings')
            .select('value')
            .eq('key', 'global_session_valid')
            .single();
        
        if (globalSession && globalSession.value === 'false') {
            throw new Error('Todas las sesiones han sido cerradas por el administrador.');
        }

        // 2. Buscar usuario en admin_users
        const { data: user, error } = await window.supabase
          .from('admin_users')
          .select('*')
          .eq('id', username)
          .eq('password', password)
          .single();

        if (error || !user) {
          throw new Error('Usuario o contraseña incorrectos');
        }

        // 3. Crear sesión en Supabase
        const token = Math.random().toString(36).substring(2);
        const { data: session, error: sError } = await window.supabase
          .from('admin_sessions')
          .insert([{ user_id: user.id, token: token, is_valid: true }])
          .select()
          .single();

        if (sError) throw sError;

        // 4. Guardar localmente
        localStorage.setItem('flashbuy_admin_session', JSON.stringify({
          id: user.id,
          name: user.name,
          role: user.role,
          token: token,
          sessionId: session.id
        }));

        window.location.href = 'admin-data001.html';
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
