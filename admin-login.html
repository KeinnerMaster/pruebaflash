<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin Login - FlashBuy</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0B1320 0%, #1a2332 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }
    .login-header {
      background: #FF7A00;
      padding: 30px;
      text-align: center;
      color: white;
    }
    .login-body { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #eee;
      border-radius: 8px;
      font-size: 16px;
    }
    .btn-login {
      width: 100%;
      padding: 15px;
      background: #FF7A00;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .error-message {
      background: #fee;
      color: #c33;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 20px;
      display: none;
      border: 1px solid #fcc;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🔐 Admin Panel</h1>
    </div>
    <div class="login-body">
      <div id="error-msg" class="error-message"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Usuario</label>
          <input type="text" id="username" required placeholder="DATA001">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="password" required placeholder="********">
        </div>
        <div style="margin-bottom: 20px; display: flex; justify-content: center;">
          <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
        </div>
        <button type="submit" class="btn-login" id="btnSubmit">Entrar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wjvhvcwnkawjtreavirm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indqdmh2Y3dua2F3anRyZWF2aXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkyNzA0MTQsImV4cCI6MjA4NDg0NjQxNH0.gKj9eBsXKoJG5PePRZyt-Vm8oQfbYXKOb77biE32nxg';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btnSubmit');
      const err = document.getElementById('error-msg');

      const captcha = grecaptcha.getResponse();
      if (!captcha) {
        err.textContent = "❌ Completa el captcha";
        err.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Cargando...";
      err.style.display = "none";

      try {
        const { data, error } = await supabase
          .from('administradores')
          .select('*')
          .eq('id', user)
          .eq('pass', pass)
          .single();

        if (error || !data) {
          throw new Error("Usuario o contraseña incorrectos");
        }

        if (!data.sesion_activa) {
          throw new Error("Tu sesión ha sido desactivada");
        }

        // Guardar sesión (Usamos id como name ya que no hay columna name)
        const session = {
          id: data.id,
          role: data.role,
          email: data.email,
          name: data.id,
          loginTime: new Date().getTime()
        };
        localStorage.setItem('flashbuy_admin_session', JSON.stringify(session));

        // Redirección inmediata
        window.location.href = 'admin-data001.html';

      } catch (e) {
        err.textContent = "❌ " + e.message;
        err.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Entrar";
        grecaptcha.reset();
      }
    });
  </script>
</body>
</html>
